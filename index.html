<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Star Furniture | Ready-Made & Custom Furniture Portfolio</title>
    <meta name="description" content="Discover premium ready-made furniture, custom interiors, modular kitchens, and explore completed portfolio projects by Sleep Star Furniture." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF7F2] text-brown-900 font-sans antialiased min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF7F2; font-family: 'Inter', sans-serif;">
        <div style="position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; width: 88px; height: 88px; border-radius: 50%; border: 2px dashed rgba(107, 142, 35, 0.4); animation: orbitSpin 5s linear infinite;"></div>
          <div style="position: absolute; width: 88px; height: 88px; border-radius: 50%; border: 2px solid transparent; border-top-color: #d97706; border-right-color: #556B2F; animation: orbitSpin 3s linear infinite;"></div>
          <div style="width: 56px; height: 56px; border-radius: 16px; background: #ffffff; padding: 6px; box-shadow: 0 10px 25px -5px rgba(45, 26, 14, 0.15); border: 1px solid rgba(201, 218, 178, 0.8); display: flex; align-items: center; justify-content: center; animation: logoPulse 2.4s ease-in-out infinite;">
            <img src="/logo.jpeg" alt="Sleep Star Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 10px;" />
          </div>
        </div>
        <div style="margin-top: 18px; text-align: center;">
          <div style="font-weight: 800; font-size: 15px; letter-spacing: 0.15em; text-transform: uppercase; color: #2D1A0E;">Sleep Star</div>
          <div style="font-weight: 700; font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: #556B2F; margin-top: 2px;">Furniture & Interiors</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
