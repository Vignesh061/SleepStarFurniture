<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep Star Furniture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@600&display=swap">
<style>
:root{--page:#f1ebdc;--btn-bg:#fffaf0;--btn-ink:#7a5410;--btn-line:#d9bd6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#10121b;--btn-bg:#212536;--btn-ink:#f1d98f;--btn-line:#6b5a2a}}
:root[data-theme="dark"]{--page:#10121b;--btn-bg:#212536;--btn-ink:#f1d98f;--btn-line:#6b5a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;font-family:'Montserrat','Segoe UI',Arial,sans-serif}
.stage{width:min(90vw,64vh,520px);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);cursor:pointer}
svg{display:block;width:100%;height:100%}
button{font:600 14px 'Montserrat','Segoe UI',Arial,sans-serif;letter-spacing:.04em;color:var(--btn-ink);background:var(--btn-bg);border:1.5px solid var(--btn-line);border-radius:999px;padding:11px 26px;cursor:pointer}
button:focus-visible{outline:3px solid #d9a52e;outline-offset:3px}

/* base (pre-animation) states */
.brand{font-family:'Poppins','Segoe UI',Arial,sans-serif;font-weight:700}
.sub{font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:600}
.ring,.ring2,.ln{fill:none;stroke:url(#gold);stroke-dasharray:1 1;stroke-dashoffset:1}
.ring{stroke-width:5;transform:rotate(-90deg);transform-origin:160px 160px}
.ring2{stroke-width:1.5;transform:rotate(-90deg);transform-origin:160px 160px}
.ln{stroke-width:4}
.cord{transform:scaleY(0);transform-origin:160px 46px}
.shade{opacity:0;transform:translateY(-40px)}
.swing{transform-origin:160px 46px}
.glow,.glow2,.lit,.cone,.t1,.t2,.table,.c1,.c2,.c3{opacity:0}
.pop{opacity:0;transform:scale(0)}
.shine{transform:translateX(-40px) skewX(-18deg)}

/* timeline */
.play .ring{animation:draw 1.8s .3s cubic-bezier(.6,.1,.2,1) forwards}
.play .ring2{animation:draw 1.6s .7s ease forwards}
.play .f1{animation:draw 1.1s 1.5s ease forwards}
.play .f2{animation:draw 1.1s 1.9s ease forwards}
.play .cord{animation:cord .75s 2.3s cubic-bezier(.3,1.35,.5,1) forwards}
.play .shade{animation:shade .75s 2.3s cubic-bezier(.3,1.35,.5,1) forwards}
.play .swing{animation:swing 2.8s 3s ease-in-out}
.play .glow,.play .lit,.play .cone{animation:flick 1.4s 3.15s forwards}
.play .night{animation:off 1.2s 3.3s ease forwards}
.play .glow2{animation:pulse 3s 4.8s ease-in-out infinite}
.play .c2{animation:rise .8s 3.9s ease-out both}
.play .table{animation:rise .8s 4.1s ease-out both}
.play .c1{animation:rise .8s 4.3s ease-out both}
.play .c3{animation:rise .8s 4.5s ease-out both}
.play .t1{animation:rise .9s 4.9s ease-out both}
.play .shine{animation:shine 1.1s 5.8s ease-in-out both}
.play .t2{animation:rise .8s 5.9s ease-out both}
.play .pop{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.play .s1{animation-delay:5.5s}.play .s2{animation-delay:5.65s}.play .s3{animation-delay:5.8s}.play .sp{animation-delay:6.5s}
.play .tw{animation:twinkle 2.6s 7.2s ease-in-out infinite}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes cord{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shade{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
@keyframes swing{0%{transform:rotate(0)}18%{transform:rotate(6deg)}38%{transform:rotate(-4.5deg)}56%{transform:rotate(3deg)}72%{transform:rotate(-1.6deg)}86%{transform:rotate(.7deg)}100%{transform:rotate(0)}}
@keyframes flick{0%{opacity:0}8%{opacity:.9}14%{opacity:.15}24%{opacity:1}32%{opacity:.4}44%{opacity:1}100%{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.6}}
@keyframes shine{from{transform:translateX(-40px) skewX(-18deg)}to{transform:translateX(360px) skewX(-18deg)}}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sleep Star Furniture logo animation">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9e0dd"/><stop offset=".5" stop-color="#f3f1e2"/><stop offset="1" stop-color="#f6dc8e"/></linearGradient>
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="300" y2="300"><stop offset="0" stop-color="#f6df93"/><stop offset=".35" stop-color="#d9a52e"/><stop offset=".65" stop-color="#f2d47a"/><stop offset="1" stop-color="#a8740f"/></linearGradient>
  <linearGradient id="goldT" gradientUnits="userSpaceOnUse" x1="0" y1="212" x2="0" y2="250"><stop offset="0" stop-color="#e9bf55"/><stop offset=".55" stop-color="#b9801a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
  <radialGradient id="night" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1f2b58"/><stop offset="1" stop-color="#0d1330"/></radialGradient>
  <radialGradient id="glowg" cx="160" cy="114" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff3b8" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd66b" stop-opacity=".45"/><stop offset="1" stop-color="#ffd66b" stop-opacity="0"/></radialGradient>
  <linearGradient id="coneg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a" stop-opacity=".85"/><stop offset="1" stop-color="#ffe08a" stop-opacity=".12"/></linearGradient>
  <linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#6b4308" flood-opacity=".35"/></filter>
  <path id="star" d="M0-5.2 1.5-1.7 5.2-1.6 2.4.7 3.2 4.4 0 2.4-3.2 4.4-2.4.7-5.2-1.6-1.5-1.7Z" fill="url(#gold)"/>
  <path id="spark" d="M0-8 1.6-1.6 8 0 1.6 1.6 0 8-1.6 1.6-8 0-1.6-1.6Z" fill="url(#gold)"/>
  <clipPath id="tc"><text x="160" y="243" text-anchor="middle" font-size="38" font-family="Poppins,'Segoe UI',Arial,sans-serif" font-weight="700" textLength="176" lengthAdjust="spacingAndGlyphs">Sleep Star</text></clipPath>
  <g id="chair" fill="none" stroke="#a96d22" stroke-linecap="round">
    <path d="M103 143V171M121 143V171M103 144H121" stroke-width="3"/>
    <path d="M107.5 144V171M112 144V171M116.5 144V171" stroke-width="1.5"/>
    <path d="M98 173H126M101 173V188M123 173V188" stroke-width="3"/>
  </g>
</defs>

<rect width="320" height="320" fill="url(#bg)"/>
<circle cx="160" cy="160" r="146" fill="#fffaf0"/>
<circle class="night" cx="160" cy="160" r="146" fill="url(#night)"/>

<!-- light beam (sways with the lamp) -->
<g class="swing">
  <circle class="glow" cx="160" cy="114" r="70" fill="url(#glowg)"/>
  <circle class="glow2" cx="160" cy="114" r="70" fill="url(#glowg)"/>
  <polygon class="cone" points="152,114 168,114 214,152 106,152" fill="url(#coneg)"/>
</g>

<!-- dining set -->
<g class="chair c2" fill="none" stroke="#a96d22" stroke-width="3" stroke-linecap="round">
  <path d="M148 140V150M172 140V150M148 140H172M146 173H174M149 173V188M171 173V188"/>
</g>
<g class="table">
  <path d="M130 169V188M190 169V188" stroke="#a96d22" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 150H210L216 169H104Z" fill="#fff" stroke="#e3dccb" stroke-width="1" stroke-linejoin="round"/>
  <path d="M124 154V167M140 154V167M160 154V167M180 154V167M196 154V167" stroke="#eee7d6" stroke-width="1"/>
</g>
<g class="chair c1"><use href="#chair"/></g>
<g class="chair c3"><use href="#chair" transform="translate(96 0)"/></g>

<!-- frames -->
<path class="ln f1" pathLength="1" d="M92 92V46H234V92"/>
<path class="ln f2" pathLength="1" d="M80 150V188H244V150"/>

<!-- lamp -->
<g class="swing">
  <line class="cord" x1="160" y1="46" x2="160" y2="86" stroke="url(#gold)" stroke-width="2.5"/>
  <g class="shade">
    <rect x="156" y="84" width="8" height="7" rx="2" fill="url(#gold)"/>
    <path d="M142 108C142 96 150 90 160 90S178 96 178 108Z" fill="url(#gold)"/>
    <path d="M147 106C147 99 151 95 156 93" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M138 109.5H182" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="114" r="4.5" fill="#d8bf78"/>
    <circle class="lit" cx="160" cy="114" r="6" fill="#fffbe0"/>
  </g>
</g>

<!-- ring -->
<circle class="ring" pathLength="1" cx="160" cy="160" r="148"/>
<circle class="ring2" pathLength="1" cx="160" cy="160" r="141"/>

<!-- brand name -->
<text class="brand t1" x="160" y="243" text-anchor="middle" font-size="38" textLength="176" lengthAdjust="spacingAndGlyphs" fill="url(#goldT)" filter="url(#sh)">Sleep Star</text>
<g clip-path="url(#tc)"><rect class="shine" x="40" y="205" width="34" height="46" fill="url(#sheen)"/></g>
<text class="sub t2" x="160" y="270" text-anchor="middle" font-size="14" textLength="132" lengthAdjust="spacing" fill="url(#goldT)">FURNITURE</text>

<!-- stars and sparkle -->
<g transform="translate(226 215) scale(1.1)"><g class="pop s1"><use class="tw" href="#star"/></g></g>
<g transform="translate(237 209) scale(1.5)"><g class="pop s2"><use class="tw" href="#star" style="animation-delay:7.6s"/></g></g>
<g transform="translate(248 215) scale(1.1)"><g class="pop s3"><use class="tw" href="#star" style="animation-delay:8s"/></g></g>
<g transform="translate(160 289)"><g class="pop sp"><use class="tw" href="#spark"/></g></g>
</svg>
</div>
<button id="replay" type="button">↻ Replay</button>
<script>
(function(){
  var st=document.getElementById('stage');
  function play(){st.classList.remove('play');void st.getBoundingClientRect();st.classList.add('play');}
  document.getElementById('replay').addEventListener('click',play);
  st.addEventListener('click',play);
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  ready.then(play,play);
})();
</script>
</body>
</html>
